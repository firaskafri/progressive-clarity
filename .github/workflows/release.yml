name: Immutable release

on:
  push:
    tags:
      - "v*.*.*-rc.*"
      - "v0.5.1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing RC or accepted v0.5.1 tag to package
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release artifacts
    if: github.repository == 'firaskafri/progressive-clarity'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.8"

      - name: Verify tag and package versions
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          uv run --python 3.11 --no-project python - "$RELEASE_TAG" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          import tomllib

          tag = sys.argv[1]
          stable = tag == "v0.5.1"
          if not stable and not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*", tag):
              raise SystemExit("only RC tags or accepted v0.5.1 are allowed")
          expected = tag.removeprefix("v")
          from tools.package_common import RELEASE_VERSION
          if expected != RELEASE_VERSION:
              raise SystemExit("tag must match the canonical package version")
          if stable:
              from tools.validate_release_acceptance import validate_acceptance
              validate_acceptance()
          notes = Path("docs/release-0.5.1.md" if stable else "docs/experimental-prerelease.md")
          if not notes.is_file() or f"`{expected}`" not in notes.read_text(encoding="utf-8"):
              raise SystemExit("reviewed release notes must name the exact version")
          versions = {
              "pyproject.toml": tomllib.loads(
                  Path("pyproject.toml").read_text(encoding="utf-8")
              )["project"]["version"],
              ".codex-plugin/plugin.json": json.loads(
                  Path(".codex-plugin/plugin.json").read_text(encoding="utf-8")
              )["version"],
              ".claude-plugin/plugin.json": json.loads(
                  Path(".claude-plugin/plugin.json").read_text(encoding="utf-8")
              )["version"],
          }
          mismatches = {
              path: version
              for path, version in versions.items()
              if version != expected
          }
          if mismatches:
              raise SystemExit(
                  f"tag {tag} does not match package versions: {mismatches}"
              )
          PY

      - name: Require successful CI on the exact release commit
        run: |
          release_sha="$(git rev-parse HEAD)"
          gh run list --workflow ci.yml --commit "$release_sha" \
            --event push --branch main --limit 100 \
            --json headSha,status,conclusion,databaseId > "$RUNNER_TEMP/release-ci.json"
          python3 - "$release_sha" "$RUNNER_TEMP/release-ci.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          sha, report = sys.argv[1:]
          runs = json.loads(Path(report).read_text(encoding="utf-8"))
          if not isinstance(runs, list) or not runs:
              raise SystemExit("release blocked: no main push CI run for the exact commit")
          latest = max(runs, key=lambda run: run["databaseId"])
          if (
              latest.get("headSha") != sha
              or latest.get("status") != "completed"
              or latest.get("conclusion") != "success"
          ):
              raise SystemExit("release blocked: latest exact-commit CI must complete successfully")
          print(f"Verified CI run {latest['databaseId']} for {sha}")
          PY

      - name: Refuse an existing release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release must not be overwritten: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Validate source and tests
        run: |
          python3 -m json.tool evals/cases.json >/dev/null
          python3 -m tools.validate_repository
          uv run --python 3.11 --no-project \
            python -m unittest discover -s tests -v
          uvx --from ruff==0.12.9 ruff check pc_core tests tools
          npx --yes @anthropic-ai/claude-code@2.1.274 \
            plugin validate .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.274 \
            plugin validate .

      - name: Build release artifacts
        run: |
          if test -d dist && test -n "$(ls -A dist)"; then
            echo "dist must be empty to avoid mixed-version artifacts" >&2
            exit 1
          fi
          uv build --out-dir dist
          uv run --python 3.11 --no-project \
            python -m tools.package_openai_plugin
          uv run --python 3.11 --no-project \
            python -m tools.package_claude_plugin
          uv run --python 3.11 --no-project \
            python -m tools.package_claude_skill
          (
            cd dist
            sha256sum \
              progressive-clarity-*.zip \
              progressive_clarity_core-* \
              | sort -k 2 > SHA256SUMS.txt
          )

      - name: Publish GitHub release
        run: |
          shopt -s nullglob
          packages=(dist/*.zip dist/*.tar.gz dist/*.whl)
          test "${#packages[@]}" -eq 5
          artifacts=(
            dist/SHA256SUMS.txt
            "${packages[@]}"
          )
          (cd dist && sha256sum --check SHA256SUMS.txt)
          release_options=(--prerelease --notes-file docs/experimental-prerelease.md)
          if test "$RELEASE_TAG" = "v0.5.1"; then
            python3 -m tools.validate_release_acceptance
            release_options=(--notes-file docs/release-0.5.1.md)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --latest=false \
            "${release_options[@]}" \
            --title "Progressive Clarity ${RELEASE_TAG#v}" \
            "${artifacts[@]}"
