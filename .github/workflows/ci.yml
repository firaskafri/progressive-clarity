name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.8"

      - name: Verify frozen protocol inputs
        run: |
          sha256sum --check --strict <<'EOF'
          a4ddc96690bd7b4a39b79a9b1f7f8d12b6aa9c1af9d377bd5d8a1e33137771a5  SPEC.md
          bfc520d496b459bdafda1d9864e5016a979a80987c4f5ce61f8de57bcb1adb56  skills/progressive-clarity/SKILL.md
          b67b2c8ac618c839c9515a11816d965603df98fa6b0b29728a47d089ad0e0b68  evals/cases.json
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path

          suite = json.loads(Path("evals/cases.json").read_text(encoding="utf-8"))
          assert suite["schema_version"] == "5.0.0"
          PY

      - name: Validate repository
        run: |
          python3 -m json.tool evals/cases.json >/dev/null
          python3 -m tools.validate_repository

      - name: Test deterministic pc-core
        run: |
          uv run --python 3.11 --no-project \
            python -m unittest discover -s tests -v
          uv run --python 3.11 --no-project \
            python -m compileall -q pc_core tests tools
          uvx --from ruff==0.12.9 ruff check pc_core tests tools

      - name: Verify installable Python package
        run: |
          uv build --out-dir "$RUNNER_TEMP/pc-dist"
          mkdir -p "$RUNNER_TEMP/pc-project/.pc-core"
          uv venv --python 3.11 \
            "$RUNNER_TEMP/pc-project/.pc-core/venv"
          uv pip install \
            --python "$RUNNER_TEMP/pc-project/.pc-core/venv/bin/python" \
            "$RUNNER_TEMP"/pc-dist/*.whl
          uv venv --python 3.11 \
            "$RUNNER_TEMP/pc-sdist-venv"
          uv pip install \
            --python "$RUNNER_TEMP/pc-sdist-venv/bin/python" \
            "$RUNNER_TEMP"/pc-dist/*.tar.gz
          "$RUNNER_TEMP/pc-sdist-venv/bin/python" -I -c \
            'import pc_core; assert pc_core.PROTOCOL_VERSION == "0.4"'
          (
            cd "$RUNNER_TEMP/pc-project"
            ".pc-core/venv/bin/python" -I -c \
              'import pc_core; assert pc_core.PROTOCOL_VERSION == "0.4"; assert pc_core.WRAPPER_REQUEST_SCHEMA_VERSION == "3.0.0"; assert pc_core.ENVELOPE_SCHEMA_VERSION == "3.0.0"; assert pc_core.STATE_SCHEMA_VERSION == "3.0.0"'
            ".pc-core/venv/bin/pc-core" --help >/dev/null
            hook_output="$(
              printf '%s\n' \
                '{"last_assistant_message":"## At a glance\nOne.\n\n## In context\nTwo.\n\n## At depth\nThree.","stop_hook_active":false}' \
                | ".pc-core/venv/bin/pc-core" hook claude-stop
            )"
            test "$hook_output" = '{}'
            focused_hook_output="$(
              printf '%s\n' \
                '{"last_assistant_message":"A concise focused answer.","stop_hook_active":false}' \
                | ".pc-core/venv/bin/pc-core" hook claude-stop
            )"
            test "$focused_hook_output" = '{}'
          )

      - name: Build deterministic OpenAI plugin
        run: |
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
          python3 -m tools.package_openai_plugin
          first_hash="$(sha256sum dist/progressive-clarity-openai-plugin-0.4.3.zip)"
          python3 -m tools.package_openai_plugin
          second_hash="$(sha256sum dist/progressive-clarity-openai-plugin-0.4.3.zip)"
          test "$first_hash" = "$second_hash"
          unzip -t dist/progressive-clarity-openai-plugin-0.4.3.zip

      - name: Build deterministic Claude packages
        run: |
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m tools.package_claude_plugin
          plugin_first="$(
            sha256sum dist/progressive-clarity-claude-plugin-0.4.3.zip
          )"
          python3 -m tools.package_claude_plugin
          plugin_second="$(
            sha256sum dist/progressive-clarity-claude-plugin-0.4.3.zip
          )"
          test "$plugin_first" = "$plugin_second"
          unzip -t dist/progressive-clarity-claude-plugin-0.4.3.zip

          python3 -m tools.package_claude_skill
          skill_first="$(
            sha256sum dist/progressive-clarity-claude-ai-skill-0.4.3.zip
          )"
          python3 -m tools.package_claude_skill
          skill_second="$(
            sha256sum dist/progressive-clarity-claude-ai-skill-0.4.3.zip
          )"
          test "$skill_first" = "$skill_second"
          unzip -t dist/progressive-clarity-claude-ai-skill-0.4.3.zip

      - name: Check out pinned skills-ref
        env:
          SKILLS_REF_REVISION: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/agentskills/agentskills.git \
            "$RUNNER_TEMP/agentskills"
          git -C "$RUNNER_TEMP/agentskills" checkout \
            --detach "$SKILLS_REF_REVISION"
          test "$(git -C "$RUNNER_TEMP/agentskills" rev-parse HEAD)" = \
            "$SKILLS_REF_REVISION"

      - name: Run official skills-ref validation
        working-directory: ${{ runner.temp }}/agentskills/skills-ref
        run: |
          uv sync
          source .venv/bin/activate
          skills-ref validate \
            "$GITHUB_WORKSPACE/skills/progressive-clarity"
