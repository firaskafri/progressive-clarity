name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.8"

      - name: Verify frozen dual-mode inputs
        run: |
          sha256sum --check --strict <<'EOF'
          ff72cb498d93f6a8d8e972798e664e64df5bbc1c99f6e0a47db819331c18e16d  SPEC.md
          5051c55286533cecf65a7963bf7fab68471986e851dbd65a21bceda0683d7562  skills/progressive-clarity/SKILL.md
          4c27a740e2e02e54f97889618397a6417c82e089b9bb44919b92642e59289680  evals/cases.json
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path

          suite = json.loads(Path("evals/cases.json").read_text(encoding="utf-8"))
          assert suite["schema_version"] == "2.0.0"
          PY

      - name: Validate dual-mode repository
        run: |
          python3 -m json.tool evals/cases.json >/dev/null
          python3 tools/validate_repository.py

      - name: Check out pinned skills-ref
        env:
          SKILLS_REF_REVISION: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/agentskills/agentskills.git \
            "$RUNNER_TEMP/agentskills"
          git -C "$RUNNER_TEMP/agentskills" checkout \
            --detach "$SKILLS_REF_REVISION"
          test "$(git -C "$RUNNER_TEMP/agentskills" rev-parse HEAD)" = \
            "$SKILLS_REF_REVISION"

      - name: Run official skills-ref validation
        working-directory: ${{ runner.temp }}/agentskills/skills-ref
        run: |
          uv sync
          source .venv/bin/activate
          skills-ref validate \
            "$GITHUB_WORKSPACE/skills/progressive-clarity"
