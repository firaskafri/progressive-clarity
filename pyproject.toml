[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "progressive-clarity-core"
version = "0.4.3"
description = "Deterministic mechanics for topic-oriented Progressive Clarity"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt"]
authors = [
  { name = "Firas Kafri" },
]

[project.urls]
Homepage = "https://firaskafri.com/progressive-clarity/"
Repository = "https://github.com/firaskafri/progressive-clarity"

[project.scripts]
pc-core = "pc_core.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSES/Apache-2.0.txt",
  "/pc_core",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["pc_core"]
